
name: Security Scanning

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bandit:
    name: Python SAST (Bandit)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: python -m pip install bandit

      - name: Scan Python source
        run: |
          python -m bandit -r app agent ingestion retrieval rag mcp_server eval -f screen